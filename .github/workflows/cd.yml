name: Continuous Deployment

on:
  push:
    branches: [main, addtests]

jobs:
  Deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Install goose
      run: go install github.com/pressly/goose/v3/cmd/goose@latest

    - name: Build the app
      run: ./scripts/buildprod.sh

    - name: Run database migrations
      run: |
        ./scripts/migrateup.sh  

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: 103631804900.dkr.ecr.eu-central-1.amazonaws.com
        ECR_REPOSITORY: notely
        IMAGE_TAG: latest
      run: |
        docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    # Deploy to AWS App Runner
    - name: Deploy to App Runner
      env:
        APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
      run: |
        # Update existing App Runner service with new image
        aws apprunner update-service \
          --service-arn "$APP_RUNNER_SERVICE_ARN" \
          --source-configuration '{
            "ImageRepository": {
              "ImageIdentifier": "'$ECR_REGISTRY'/'$ECR_REPOSITORY':'$IMAGE_TAG'",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8080",
                "RuntimeEnvironmentVariables": {
                  "DATABASE_URL": "'${{ secrets.DATABASE_URL }}'",
                  "TURSO_AUTH_TOKEN": "'${{ secrets.TURSO_AUTH_TOKEN }}'",
                  "TURSO_DATABASE_URL": "'${{ secrets.TURSO_DATABASE_URL }}'"
                }
              }
            }
          }'
